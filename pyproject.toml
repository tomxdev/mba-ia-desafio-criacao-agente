[project]
name = "aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora (Google ADK + FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "google-adk[db]==2.10.0",
    "greenlet>=3.5.6",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
aurora-api = "aurora.api:main"
aurora-restaurar = "aurora.restaurar:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aurora"
module-root = ""
